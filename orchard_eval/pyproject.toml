[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orchard-eval"
version = "0.1.0"
description = "Evaluate any agent harness on SWE-bench using Orchard Env sandboxes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "orchard-env>=0.1.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Official SWE-bench grading + dataset loading.
swebench = [
    "swebench>=3.0.0",
    "datasets>=2.19.0",
]
# SWE-bench Pro grades with the per-instance scripts its own repo ships, so it
# needs nothing beyond a dataset loader.
swebench-pro = [
    "datasets>=2.19.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.11.0",
    "ruff>=0.1.6",
]
all = [
    "orchard-eval[swebench,swebench-pro,dev]",
]

[project.scripts]
orchard-eval = "orchard_evalkit.cli:main"

[project.urls]
Homepage = "https://github.com/microsoft/Orchard-Agentic"
Repository = "https://github.com/microsoft/Orchard-Agentic"

[tool.setuptools.packages.find]
include = ["orchard_evalkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
